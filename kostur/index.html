<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 480px;
            margin: 60px auto;
            color: #222;
        }
        h1 { font-size: 1.4rem; margin-bottom: 1rem; }
        form.add-form { display: flex; gap: 8px; margin-bottom: 1.5rem; }
        form.add-form input[type=text] {
            flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
        }
        button {
            padding: 8px 14px; border: none; border-radius: 6px;
            background: #2563eb; color: white; cursor: pointer; font-size: 0.9rem;
        }
        button.secondary { background: #e5e7eb; color: #222; }
        ul { list-style: none; padding: 0; }
        li {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid #eee;
        }
        li.done span.task { text-decoration: line-through; color: #999; }
        li .actions { display: flex; gap: 6px; }
        li .actions form { display: inline; }
    </style>
</head>
<body>
    <h1>My To-Do List</h1>

    <form class="add-form" action="{{ url_for('add') }}" method="post">
        <input type="text" name="task" placeholder="Add a new task..." required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for todo in todos %}
        <li class="{{ 'done' if todo.is_done else '' }}">
            <span class="task">{{ todo.task }}</span>
            <span class="actions">
                <form action="{{ url_for('toggle', todo_id=todo.id) }}" method="post">
                    <button type="submit" class="secondary">
                        {{ 'Undo' if todo.is_done else 'Done' }}
                    </button>
                </form>
                <form action="{{ url_for('delete', todo_id=todo.id) }}" method="post">
                    <button type="submit" class="secondary">Delete</button>
                </form>
            </span>
        </li>
        {% else %}
        <li>No tasks yet — add one above.</li>
        {% endfor %}
    </ul>
</body>
</html>
